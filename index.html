<!doctype html>
<html lang="en">
  

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Alec Tolentino | Portfolio</title>
  </head>
  <body>
    <div id="app"></div>

        <!-- Loading screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <p class="loading-label">ALEC TOLENTINO <span>·</span> PORTFOLIO</p>

            <!-- Badminton loading animation -->
            <div class="badminton-animation">
                <svg id="shuttle-animation" viewBox="0 0 200 200">
                    <g id="shuttle-trail"></g>
                    <g id="shuttlecock">

                        <!-- Feather skirt -->
                        <path d="M-16 -27 Q-14 -31 0 -32 Q14 -31 16 -27 L6 0 Q0 4 -6 0 Z" fill="#f4f4f1" stroke="#ffffff" stroke-width="1"/>

                        <!-- Individual feather sections -->
                        <path d="M-13 -27 L-5 1" stroke="#a9aaa9" stroke-width="1" fill="none"/>
                        <path d="M-8 -30 L-2 2" stroke="#a9aaa9" stroke-width="1" fill="none"/>
                        <path d="M0 -31 L0 3" stroke="#a9aaa9" stroke-width="1" fill="none"/>
                        <path d="M8 -30 L2 2" stroke="#a9aaa9" stroke-width="1" fill="none"/>
                        <path d="M13 -27 L5 1" stroke="#a9aaa9" stroke-width="1" fill="none"/>

                        <!-- Cork -->
                        <path d="M-6 0 Q0 -3 6 0 L8 10 Q0 16 -8 10 Z" fill="#c6a77b" stroke="#e5d6bd" stroke-width="1"/>

                        <!-- Cork highlight -->
                        <path d="M-3 2 Q0 1 3 2" stroke="#eee0c8" stroke-width="1" fill="none"/>
                    </g>
                </svg>

            </div>

            <!-- Loading progress -->
            <div class="loading-progress">

                <div class="loading-progress-info">
                    <span id="loading-status">LOADING EXPERIENCE</span>
                    <span id="loading-percent">0%</span>
                </div>

                <div class="loading-progress-track">
                    <div id="loading-bar-fill"></div>
                </div>

            </div>

            <!-- Appears when loading finishes -->
            <button id="start-button" disabled>
                START EXPLORING <span>→</span>
            </button>

        </div>

    </div>

    <!-- Three.js experience -->
    <div id="experience">
      <canvas id="experience-canvas" class="experience-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
