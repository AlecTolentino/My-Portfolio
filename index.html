
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <title>Alec Tolentino | Portfolio</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-scene">
          <p class="loading-label">ALEC TOLENTINO <span>·</span> PORTFOLIO</p>

          <!-- Badminton loading animation -->
          <div class="badminton-animation">
            <svg id="shuttle-animation" viewBox="0 0 200 200">
              <g id="shuttle-trail"></g>
              <g id="shuttlecock">

                <!-- Individual feathers -->
                <path d="M-16 -27 Q-14 -32 0 -32 Q14 -32 16 -27 L6 0 Q0 4 -6 0 Z" fill="#F4F4F1" stroke="#FFFFFF" stroke-width="1"/>
                <path d="M-14 -27 Q-10 -15 -5 1" fill="none" stroke="#BFC2C8" stroke-width="0.9"/>
                <path d="M-8 -30 Q-5 -14 -2 2" fill="none" stroke="#BFC2C8" stroke-width="0.9"/>
                <path d="M0 -31 L0 3" fill="none" stroke="#BFC2C8" stroke-width="0.9"/>
                <path d="M8 -30 Q5 -14 2 2" fill="none" stroke="#BFC2C8" stroke-width="0.9"/>
                <path d="M14 -27 Q10 -15 5 1" fill="none" stroke="#BFC2C8" stroke-width="0.9"/>

                <!-- Black feather binding -->
                <path d="M-7 -4 Q0 0 7 -4 L8 2 Q0 7 -8 2 Z" fill="#17171C" stroke="#000000" stroke-width="1"/>

                <!-- Cork -->
                <path d="M-6 2 Q0 -1 6 2 L8 12 Q0 18 -8 12 Z" fill="#FFFFFF" stroke="#D5D5D8" stroke-width="1"/>
                <path d="M-3 5 Q0 4 3 5" fill="none" stroke="#E1E1E4" stroke-width="1"/>
              </g>
            </svg>
          </div>

          <!-- Loading progress -->
          <div class="loading-progress">
            <div class="loading-progress-info">
              <span id="loading-status">LOADING EXPERIENCE</span>
              <span id="loading-percent">0%</span>
            </div>

            <div class="loading-progress-track">
              <div id="loading-bar-fill"></div>
            </div>
          </div>

        </div>

        <!-- Appears when loading finishes -->
        <button id="start-button" disabled>START EXPLORING <span>→</span></button>

      </div>
    </div>

    <!-- Three.js experience -->
    <div id="experience">
      <canvas id="experience-canvas" class="experience-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
